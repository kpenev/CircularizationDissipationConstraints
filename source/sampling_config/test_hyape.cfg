sampling = mcmc

num-parallel-processes = 16
mcmc-nwalkers = 128
mcmc-nsteps = 10000

photometric-constraint-pickle-fname = /home/vortebo/pickles/%(system)s_photometric_constraints.pkl
rv-likelihood-pickle-fname = /home/vortebo/pickles/%(system)s_rv_likelihood.pkl
mass-sampling-pickle-fname = /home/vortebo/pickles/%(system)s_sample_sb1_masses.pkl

stellar-evolution-interpolator-dir = /home/vortebo/ctime/poet/stellar_evolution_interpolators
eccentricity-expansion-coefficients = /home/vortebo/eccentricity_expansion_coef_O400.sqlite

logging-verbosity = debug
std-out-err-fname = /home/vortebo/scratch/open_cluster_circularization/sampling_output/%(system)s_%(now)s_%(pid)d.outerr
logging-fname = /home/vortebo/scratch/open_cluster_circularization/sampling_output/%(system)s_%(now)s_%(pid)d.log
samples-fname = /home/vortebo/scratch/open_cluster_circularization/sampling_results/%(system)s_%(sampling)s_samples

initial-eccentricity = [0.8, 0.8]

lgQ-break-period = [0.5, 20.0]
lgQ-powerlaw = [-5.0, 5.0]
lgQ-min = [5.0, 12.0]

evolution-timeout = 3600.0

disk-dissipation-age = [20.0, 20.0]

primary-core-envelope-coupling-timescale = [5.0, 5.0]
secondary-core-envelope-coupling-timescale = [5.0, 5.0]

primary-disk-lock-period = [10.0, 10.0]
secondary-disk-lock-period = [10.0, 10.0]
